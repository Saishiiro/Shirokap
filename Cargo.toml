[package]
name = "shirokap"
version = "1.2.0"
edition = "2021"

[dependencies]
eframe = { version = "=0.29.1", default-features = false, features = ["default_fonts", "glow"] }
tray-icon = "0.26"
tao = "0.37"
global-hotkey = "0.9"
xcap = { version = "0.9", features = ["wgc"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
arboard = "3.7"
trash = "5"
rfd = "0.17"
chrono = "0.4"
directories = "6"
serde = { version = "1", features = ["derive"] }
toml = "1"
ab_glyph = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_Security", "Win32_Media_Audio", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
raw-window-handle = "0.6"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
